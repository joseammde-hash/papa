<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrenador de puntería</title>
<style>
  :root { --bg:#0e1116; --fg:#e8eaed; --accent:#ff4d4d; --muted:#8a93a0; --panel:#171b22; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; background:var(--panel); }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  select, button, input { background:#232933; color:var(--fg); border:1px solid #333b47; border-radius:6px; padding:6px 10px; font-size:14px; }
  button { cursor:pointer; background:var(--accent); border:none; font-weight:600; }
  label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #stats { margin-left:auto; font-variant-numeric:tabular-nums; font-size:14px; }
  #wrap { position:relative; }
  canvas { display:block; width:100%; height:calc(100vh - 110px); cursor:crosshair; touch-action:none; }
  #help { padding:8px 16px; font-size:13px; color:var(--muted); }
  #result { position:absolute; inset:0; display:none; place-items:center; background:#000a; text-align:center; }
  #result div { background:var(--panel); padding:24px 32px; border-radius:12px; }
</style>
</head>
<body>
<header>
  <h1>Entrenador de puntería</h1>
  <label>Modo
    <select id="mode">
      <option value="click">Click (flicks)</option>
      <option value="track">Tracking (seguir objetivo)</option>
      <option value="recoil">Control de recoil (arrastre)</option>
    </select>
  </label>
  <label>Tamaño <input id="size" type="range" min="12" max="60" value="30"></label>
  <label>Velocidad <input id="speed" type="range" min="1" max="10" value="4"></label>
  <label>Duración
    <select id="dur"><option>30</option><option selected>60</option><option>120</option></select> s
  </label>
  <button id="start">Empezar</button>
  <div id="stats">—</div>
</header>
<div id="help"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="result"><div><h2 id="rt"></h2><p id="rp"></p><button id="again">Repetir</button></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const HELP = {
  click: 'Haz click en cada objetivo lo más rápido y preciso posible. Mide precisión y tiempo de reacción.',
  track: 'Mantén el cursor sobre el objetivo móvil. Mide el % de tiempo que lo sigues (igual que seguir a un enemigo con la mira).',
  recoil: 'Pon el cursor sobre el aro gris, mantén pulsado el ratón y arrastra en sentido contrario al retroceso para que el punto verde (impacto) se quede en el aro. Cada arma tiene su propio patrón.'
};
// Patrones de ejemplo (genéricos, NO son los valores reales del juego):
// cada entrada = desplazamiento del punto de impacto por disparo, en px (dx, dy; dy negativo = sube).
const PATTERNS = {
  'Vertical suave':   [[0,-6],[1,-7],[-1,-7],[0,-8],[1,-8],[-1,-8],[0,-8],[1,-7],[-1,-7],[0,-6]],
  'Zigzag lateral':   [[0,-5],[6,-6],[8,-6],[2,-5],[-6,-6],[-8,-6],[-2,-5],[6,-6],[8,-6],[2,-5]],
  'Sube y deriva dcha':[[0,-6],[2,-7],[4,-7],[6,-7],[7,-6],[8,-6],[8,-5],[9,-5],[9,-4],[9,-4]]
};
let W, H, running = false, t0, dur, targets = [], hits = 0, shots = 0, rts = [], onTime = 0, lastT = 0;
let mouse = {x:0,y:0,down:false}, tgt = {x:0,y:0,vx:0,vy:0};
let rec = {};

function resize(){ cv.width = cv.clientWidth; cv.height = cv.clientHeight; W = cv.width; H = cv.height; }
addEventListener('resize', resize); resize();
$('mode').onchange = () => $('help').textContent = HELP[$('mode').value];
$('help').textContent = HELP.click;

function spawn(){
  const r = +$('size').value;
  targets = [{x: r+Math.random()*(W-2*r), y: r+Math.random()*(H-2*r), r, born: performance.now()}];
}
function start(){
  resize(); hits = shots = onTime = 0; rts = []; running = true;
  dur = +$('dur').value*1000; t0 = lastT = performance.now();
  $('result').style.display = 'none';
  const mode = $('mode').value;
  if (mode === 'click') spawn();
  if (mode === 'track'){ tgt = {x:W/2, y:H/2, vx:1, vy:.6}; }
  if (mode === 'recoil'){
    const names = Object.keys(PATTERNS);
    rec = {pat: PATTERNS[names[Math.floor(Math.random()*names.length)]], idx:0, off:{x:0,y:0}, err:[], lastShot:0, aim:{x:W/2, y:H*0.6}};
  }
  requestAnimationFrame(loop);
}
function end(){
  running = false;
  const mode = $('mode').value; let title, body;
  if (mode === 'click'){
    const acc = shots ? Math.round(hits/shots*100) : 0;
    const avg = rts.length ? Math.round(rts.reduce((a,b)=>a+b,0)/rts.length) : 0;
    title = `${hits} aciertos`; body = `Precisión ${acc}% · tiempo medio ${avg} ms`;
  } else if (mode === 'track'){
    title = `${Math.round(onTime/dur*100)}% sobre el objetivo`; body = 'Sube la velocidad cuando superes el 70%.';
  } else {
    const e = rec.err.length ? Math.round(rec.err.reduce((a,b)=>a+b,0)/rec.err.length) : 0;
    title = `Error medio ${e}px`; body = 'Menos es mejor. Repite: cada ráfaga muestra otro patrón.';
  }
  $('rt').textContent = title; $('rp').textContent = body; $('result').style.display = 'grid';
}
function loop(now){
  if (!running) return;
  const dt = (now-lastT)/16.67; lastT = now;
  const left = dur-(now-t0);
  if (left <= 0) return end();
  const mode = $('mode').value, sp = +$('speed').value;
  ctx.clearRect(0,0,W,H);
  if (mode === 'click'){
    for (const t of targets){ ctx.fillStyle='#ff4d4d'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,7); ctx.fill(); }
  } else if (mode === 'track'){
    tgt.x += tgt.vx*sp*1.5*dt; tgt.y += tgt.vy*sp*1.5*dt;
    if (Math.random()<0.02*dt){ const a=Math.random()*6.28; tgt.vx=Math.cos(a); tgt.vy=Math.sin(a); }
    const r=+$('size').value;
    if (tgt.x<r||tgt.x>W-r) tgt.vx*=-1; if (tgt.y<r||tgt.y>H-r) tgt.vy*=-1;
    tgt.x=Math.min(W-r,Math.max(r,tgt.x)); tgt.y=Math.min(H-r,Math.max(r,tgt.y));
    const on = Math.hypot(mouse.x-tgt.x, mouse.y-tgt.y) < r;
    if (on) onTime += dt*16.67;
    ctx.fillStyle = on ? '#3ddc84' : '#ff4d4d';
    ctx.beginPath(); ctx.arc(tgt.x,tgt.y,r,0,7); ctx.fill();
  } else {
    // Cada 90 ms con el botón pulsado se acumula retroceso (el impacto sube/deriva).
    // Impacto = cursor + retroceso acumulado. Hay que arrastrar el ratón en sentido
    // contrario para mantener el impacto sobre el aro gris.
    if (mouse.down && now-rec.lastShot > 90){
      rec.lastShot = now;
      const p = rec.pat[rec.idx % rec.pat.length]; rec.idx++;
      rec.off.x += p[0]; rec.off.y += p[1];
      shots++;
    }
    if (!mouse.down){ rec.idx = 0; rec.off = {x:0,y:0}; }
    const ix = mouse.x+rec.off.x, iy = mouse.y+rec.off.y;
    if (mouse.down && now-rec.lastShot < 20) rec.err.push(Math.hypot(ix-rec.aim.x, iy-rec.aim.y));
    ctx.strokeStyle='#8a93a0'; ctx.beginPath(); ctx.arc(rec.aim.x,rec.aim.y,18,0,7); ctx.stroke();
    ctx.fillStyle='#3ddc84'; ctx.beginPath(); ctx.arc(ix,iy,6,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(mouse.x-1,mouse.y-8,2,16); ctx.fillRect(mouse.x-8,mouse.y-1,16,2);
  }
  const s = mode==='click' ? `${hits}/${shots} · ` : '';
  $('stats').textContent = `${s}${Math.ceil(left/1000)} s`;
  requestAnimationFrame(loop);
}
function pos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
cv.addEventListener('pointermove', e => Object.assign(mouse, pos(e)));
cv.addEventListener('pointerup', () => mouse.down = false);
cv.addEventListener('pointerdown', e => {
  Object.assign(mouse, pos(e)); mouse.down = true;
  if (!running || $('mode').value !== 'click') return;
  shots++;
  const t = targets[0];
  if (Math.hypot(mouse.x-t.x, mouse.y-t.y) < t.r){ hits++; rts.push(performance.now()-t.born); spawn(); }
});
$('start').onclick = start; $('again').onclick = start;
</script>
</body>
</html>
